<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ .Card.StageTitle }} — стадии гипертонии</title>
    <link rel="stylesheet" href="/static/styles/hypertension.css">
</head>
<body class="app-body feed-body">
<main class="phone-shell feed-shell">
    <section class="feed-media">
        <video class="feed-video" autoplay muted loop playsinline poster="{{ .Card.Service.ImageURL }}">
            <source src="{{ .Card.Service.VideoURL }}" type="video/mp4">
        </video>
        <div class="feed-shade"></div>

        <aside class="feed-actions">

            <div class="feed-like" aria-label="Количество лайков">
                <span class="heart-icon">♡</span><span>{{ .Card.LikesCount }}</span>
            </div>
            <a class="next-button" href="/feed/{{ .Card.Service.ID }}?next=true">Далее</a>
        </aside>

        <section class="feed-copy">
            <h1>{{ .Card.StageRomanTitle }}<br>гипертонической<br>болезни</h1>
            <div class="feed-divider"></div>
            <details class="feed-description">
                <summary>{{ .Card.Service.Description }}</summary>
            </details>
        </section>
    </section>

    <nav class="bottom-nav" aria-label="Основная навигация">
        <a class="active" href="/feed/">лента</a>
        <a href="/draft">добавить</a>
        <a href="/stages">плитка</a>
    </nav>
</main>
</body>
</html>
