<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Плитка — стадии гипертонии</title>
    <link rel="stylesheet" href="/resources/styles/hypertension.css">
</head>
<body class="app-body grid-body">
<main class="phone-shell grid-shell">
    <section class="search-zone">
        <form class="sbp-search" action="/stages" method="GET">
            <input name="sbp" type="number" min="1" placeholder="Систолическое АД" value="{{ .SBPQuery }}" aria-label="Фильтр по систолическому АД">
            <button type="submit" aria-label="Найти по систолическому АД"><span class="search-icon"></span></button>
        </form>
        {{ if .FilterError }}<p class="filter-error">{{ .FilterError }}</p>{{ end }}
    </section>

    <section class="stage-grid">
        {{ range .Cards }}
        <article class="stage-card" data-video-url="{{ if .Service.VideoURL }}{{ .Service.VideoURL }}{{ else }}/resources/media/stage1.mp4{{ end }}">
            <a class="stage-card-link" href="/feed/{{ .Service.ID }}">
                {{ if .Service.ImageURL }}
                <img src="{{ .Service.ImageURL }}" alt="{{ .StageTitle }}">
                {{ else }}
                <img src="/resources/media/stage1.png" alt="Фото по умолчанию для {{ .StageTitle }}">
                {{ end }}
                <div class="stage-card-copy">
                    <div class="stage-card-head">
                        <h2>{{ .StageTitle }}</h2>
                        <span class="card-likes">♡ {{ .LikesCount }}</span>
                    </div>
                    <p>{{ .StageRange }}</p>
                </div>
            </a>

            <form class="stage-delete-form" action="/stages/{{ .Service.ID }}/delete" method="POST">
                <button class="stage-delete-button" type="submit">Удалить</button>
            </form>
        </article>
        {{ else }}
        <p class="empty-result">Для введенного САД карточка не найдена.</p>
        {{ end }}
    </section>

    <nav class="bottom-nav" aria-label="Основная навигация">
        <a href="/feed/">лента</a>
        <a href="/draft">добавить</a>
        <a class="active" href="/stages">плитка</a>
    </nav>
</main>
</body>
</html>
